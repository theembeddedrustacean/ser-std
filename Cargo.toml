[workspace]
resolver = "2"
members = [
    "ch5-gpio-q5",
    "ch5-gpio-q6",
    "ch5-gpio-q8-q9",
    "ch6-adc-q4",
    "ch6-adc-q5",
    "ch6-adc-q6-q7",
    "ch7-timers-q2",
    "ch8-pwm-q3",
    "ch8-pwm-q4",
    "ch8-pwm-q5",
    "ch8-pwm-q6",
]

[workspace.dependencies]
log = { version = "0.4.22", default-features = false }
esp-idf-svc = { version = "0.51", default-features = false }
embuild = "0.33.0"

[workspace.package]
version = "0.1.0"
authors = [
    "The Embedded Rustacean <166909466+theembeddedrustacean@users.noreply.github.com>",
]
edition = "2021"
rust-version = "1.71"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[workspace.features]
default = ["std", "embassy", "esp-idf-svc/native"]
pio = ["esp-idf-svc/pio"]
std = ["alloc", "esp-idf-svc/binstart", "esp-idf-svc/std"]
alloc = ["esp-idf-svc/alloc"]
nightly = ["esp-idf-svc/nightly"]
experimental = ["esp-idf-svc/experimental"]
embassy = [
    "esp-idf-svc/embassy-sync",
    "esp-idf-svc/critical-section",
    "esp-idf-svc/embassy-time-driver",
]
